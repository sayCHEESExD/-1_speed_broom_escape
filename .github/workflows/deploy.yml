# Deploy to Bloxity Hosting.
#
#   dev   -> Bloxity "dev" channel
#   main  -> Bloxity "prod" channel
#
# Two halves, because the game is two things: a Colyseus server that runs as a
# long-lived container, and a static Vite build. The server image goes to GHCR
# and is rolled by the Legion control plane; the client is built and uploaded
# to Bloxity Hosting as a zip.
#
# Both Bloxity calls below are copied from https://hosting.bloxity.io/docs
# (steps 3 and 4), and both routes were checked against the live API before
# being written here: each answers 401 without a token, where an invented
# sibling route answers 404 "Route ... not found". The ONLY secret either needs
# is LEGION_DEPLOY_TOKEN - the docs are explicit that there is nothing else.
name: Deploy to Bloxity

on:
  push:
    branches: [dev, main]
  # A manual re-run of the branch it is started from. There is deliberately NO
  # channel picker: the channel follows the branch and nothing else, so a
  # button can never ship the dev branch to prod.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # One deploy per channel at a time, and never cancelled halfway. A deploy cut
  # off between rolling the server and uploading the client would leave the
  # two halves on different commits; queueing instead lets it finish, and
  # GitHub keeps only the newest waiting run behind it.
  group: bloxity-deploy-${{ github.ref_name }}
  cancel-in-progress: false

env:
  # The game id this project is registered under on hosting.bloxity.io. It is
  # also the SDK's game slug: Legion injects it into the server as
  # BLOXITY_GAME_ID, and the client is built with it below.
  BLOXITY_GAME_ID: speed-broom-escape

  # The room's player cap - MAX_PLAYERS_PER_ROOM in shared/src/constants. Legion
  # fills a pod to seatCap and then spawns the next one, so this MUST equal the
  # Colyseus room's maxClients: a larger figure would have the matchmaker send
  # a sixteenth player to a room that refuses them.
  SEAT_CAP: '15'
  # The pod ceiling, so total capacity is 15 x 5 = 75 concurrent players.
  MAX_REPLICAS: '5'

jobs:
  # Which channel this run publishes to and which image it builds, decided once
  # so every job agrees.
  plan:
    runs-on: ubuntu-latest
    outputs:
      channel: ${{ steps.pick.outputs.channel }}
      image: ${{ steps.pick.outputs.image }}
      server_url: ${{ steps.pick.outputs.server_url }}
    steps:
      - id: pick
        env:
          BRANCH: ${{ github.ref_name }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          case "$BRANCH" in
            dev)
              CHANNEL=dev
              SERVER_URL="wss://${BLOXITY_GAME_ID}.dev.host.bloxity.io" ;;
            main)
              CHANNEL=prod
              SERVER_URL="wss://${BLOXITY_GAME_ID}.host.bloxity.io" ;;
            *)
              echo "::error::Only 'dev' (-> dev) and 'main' (-> prod) deploy. '$BRANCH' does not."
              exit 1 ;;
          esac
          # A Docker reference must be lowercase, and GitHub owners often are
          # not. Shape per the docs: ghcr.io/<owner>/<game>-server.
          IMAGE="ghcr.io/${OWNER,,}/${BLOXITY_GAME_ID}-server"
          {
            echo "channel=$CHANNEL"
            echo "image=$IMAGE"
            echo "server_url=$SERVER_URL"
          } >> "$GITHUB_OUTPUT"
          echo "Branch '$BRANCH' -> channel '$CHANNEL', image $IMAGE:$CHANNEL-$GITHUB_SHA"

  # The repo's own gates, run ONCE and required by BOTH deploy jobs. A server
  # image that typechecks but fails "verify" is a broken game, and nothing is
  # published - on either half - until these pass.
  verify:
    needs: plan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run verify
      - run: npm run verify:assets

  # ------------------------------------------------------------------ server
  server:
    needs: [plan, verify]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required to push to ghcr.io with the built-in GITHUB_TOKEN.
      packages: write
    env:
      CHANNEL: ${{ needs.plan.outputs.channel }}
      IMAGE: ${{ needs.plan.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the server image
        uses: docker/build-push-action@v6
        with:
          # The repository root: the Dockerfile installs the whole npm
          # workspace because the server imports @broom/shared.
          context: .
          file: ./Dockerfile
          push: true
          # The IMMUTABLE "<channel>-<sha>" tag is what gets deployed. The
          # moving "<channel>" tag is only a pointer for humans reading the
          # package list; deploying it would let a re-run roll out whatever a
          # later push had since overwritten.
          tags: |
            ${{ env.IMAGE }}:${{ env.CHANNEL }}-${{ github.sha }}
            ${{ env.IMAGE }}:${{ env.CHANNEL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Roll the server on Legion
        env:
          TOKEN: ${{ secrets.LEGION_DEPLOY_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${TOKEN:-}" ]; then
            echo "::error::LEGION_DEPLOY_TOKEN is not set. Add it under Settings -> Secrets and variables -> Actions."
            exit 1
          fi

          URL="https://legion.bloxity.io/v1/apps/${BLOXITY_GAME_ID}/deploy"

          # Exactly the documented payload. seatCap and maxReplicas are numbers,
          # hence --argjson. No port: Legion injects PORT and the server reads it.
          PAYLOAD=$(jq -n \
            --arg channel "$CHANNEL" \
            --arg image "${IMAGE}:${CHANNEL}-${GITHUB_SHA}" \
            --arg version "$GITHUB_SHA" \
            --argjson seatCap "$SEAT_CAP" \
            --argjson maxReplicas "$MAX_REPLICAS" \
            '{channel: $channel, image: $image, version: $version, seatCap: $seatCap, maxReplicas: $maxReplicas}')

          echo "POST $URL"
          echo "$PAYLOAD" | jq .

          HTTP=$(curl -sS -o deploy.out -w '%{http_code}' \
            -X POST "$URL" \
            -H "Authorization: Bearer ${TOKEN}" \
            -H 'Content-Type: application/json' \
            --data "$PAYLOAD") || HTTP=000

          echo "--- response ($HTTP) ---"
          cat deploy.out 2>/dev/null || true
          echo

          case "$HTTP" in
            2*) ;;
            401|403)
              echo "::error::Legion rejected the token. Re-copy LEGION_DEPLOY_TOKEN from My Games on hosting.bloxity.io (the eye icon)."
              exit 1 ;;
            404)
              echo "::error::Legion has no game '${BLOXITY_GAME_ID}'. Create it on hosting.bloxity.io -> My Games with exactly that id."
              exit 1 ;;
            000)
              echo "::error::Could not reach legion.bloxity.io."
              exit 1 ;;
            *)
              echo "::error::Server deploy failed with HTTP $HTTP. If Legion reports it cannot pull the image, make the GHCR package public (repo -> Packages -> Package settings -> Change visibility)."
              exit 1 ;;
          esac

          if [ "$CHANNEL" = "dev" ]; then HOST="${BLOXITY_GAME_ID}.dev.host.bloxity.io"; else HOST="${BLOXITY_GAME_ID}.host.bloxity.io"; fi
          echo "Server rolled: https://${HOST} (seatCap ${SEAT_CAP}, maxReplicas ${MAX_REPLICAS}, version ${GITHUB_SHA})" | tee -a "$GITHUB_STEP_SUMMARY"

  # ------------------------------------------------------------------ client
  client:
    needs: [plan, verify]
    runs-on: ubuntu-latest
    env:
      CHANNEL: ${{ needs.plan.outputs.channel }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      - name: Build the client
        env:
          # Baked in at build time - Vite has no later step in which to inject
          # them. The game id doubles as the Bloxity SDK slug, which selects the
          # Bux catalogue and scopes the login token the server verifies.
          VITE_BLOXITY_GAME_ID: ${{ env.BLOXITY_GAME_ID }}
          # This channel's Colyseus backend, per the docs' step 2.
          VITE_SERVER_URL: ${{ needs.plan.outputs.server_url }}
        run: |
          set -euo pipefail
          echo "VITE_BLOXITY_GAME_ID=$VITE_BLOXITY_GAME_ID"
          echo "VITE_SERVER_URL=$VITE_SERVER_URL"
          npm run build:client
          # Prove the URL actually made it into the bundle, rather than trusting
          # that Vite read the variable.
          grep -rqF "$VITE_SERVER_URL" client/dist/assets || {
            echo "::error::$VITE_SERVER_URL is not in the built bundle."
            exit 1
          }

      - name: Check the build against the 12 MB budget
        run: npm run size:client

      - name: Package the client
        run: |
          set -euo pipefail
          test -f client/dist/index.html || { echo "::error::client/dist/index.html is missing - the build produced nothing."; exit 1; }
          # Zipped from INSIDE client/dist, so index.html sits at the archive
          # ROOT rather than under a "dist/" directory the host would serve as a
          # subpath.
          (cd client/dist && zip -qr "${GITHUB_WORKSPACE}/client-dist.zip" .)
          unzip -Z1 client-dist.zip | grep -qx 'index.html' || {
            echo "::error::index.html is not at the root of client-dist.zip."
            unzip -l client-dist.zip
            exit 1
          }
          ls -la client-dist.zip
          unzip -l client-dist.zip

      - name: Keep the bundle on the run
        uses: actions/upload-artifact@v4
        with:
          name: client-${{ env.CHANNEL }}-${{ github.sha }}
          path: client-dist.zip
          retention-days: 14

      - name: Upload the client to Bloxity Hosting
        env:
          TOKEN: ${{ secrets.LEGION_DEPLOY_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${TOKEN:-}" ]; then
            echo "::error::LEGION_DEPLOY_TOKEN is not set. Add it under Settings -> Secrets and variables -> Actions."
            exit 1
          fi

          # The documented route. "version" is required: it is what the
          # dashboard compares with the deployed backend's version, and both
          # halves use the commit sha so a matching pair reads as matching.
          URL="https://api.bloxity.io/v1/hosting/games/${BLOXITY_GAME_ID}/frontend?channel=${CHANNEL}&version=${GITHUB_SHA}"
          echo "POST $URL"

          # The zip is the raw request BODY, not a multipart field.
          HTTP=$(curl -sS -o upload.out -w '%{http_code}' \
            -X POST "$URL" \
            -H "Authorization: Bearer ${TOKEN}" \
            -H 'Content-Type: application/zip' \
            --data-binary @client-dist.zip) || HTTP=000

          echo "--- response ($HTTP) ---"
          cat upload.out 2>/dev/null || true
          echo

          case "$HTTP" in
            2*) ;;
            401|403)
              echo "::error::Bloxity rejected the token. Re-copy LEGION_DEPLOY_TOKEN from My Games on hosting.bloxity.io (the eye icon)."
              exit 1 ;;
            000)
              echo "::error::Could not reach api.bloxity.io."
              exit 1 ;;
            *)
              echo "::error::Client upload failed with HTTP $HTTP. The bundle is attached to this run as an artifact."
              exit 1 ;;
          esac

          if [ "$CHANNEL" = "dev" ]; then HOST="${BLOXITY_GAME_ID}.dev.play.bloxity.io"; else HOST="${BLOXITY_GAME_ID}.play.bloxity.io"; fi
          echo "Client published: https://${HOST} (version ${GITHUB_SHA})" | tee -a "$GITHUB_STEP_SUMMARY"
